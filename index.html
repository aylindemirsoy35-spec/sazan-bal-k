<!-- ÜRÜN KARTI: ALABALIK PANOSU -->
<div class="urun-kart">
    <img src="https://zyrosite.com" alt="Ahşap Intarsia Alabalık Duvar Panosu">
    <h3>Ahşap Intarsia Alabalık Duvar Panosu</h3>
    <p>Doğal ahşap liflerinin ve özel seçilmiş kırmızımsı ağaç katmanlarının intarsia tekniğiyle hayat bulduğu, hareketli ve estetik alabalık figürü.</p>
    
    <!-- Fiyatı buradan istediğiniz gibi değiştirebilirsiniz -->
    <span class="fiyat">1.500 TL</span> 
    
    <!-- Bu buton videoyu ücretsiz olarak sitenizin içinde açacak -->
    <button class="luma-video-btn" onclick="videoPencerisiniAc('BURAYA_LUMA_VIDEO_LINKI_GELECEK')">Luma ile Tanıtım Videosu İzle</button>
</div>

<!-- GİZLİ VİDEO PENCERESİ (POPUP MODAL) -->
<div id="videoModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9999; justify-content:center; align-items:center;">
    <div style="background:#fff; padding:20px; border-radius:8px; position:relative; width:90%; max-width:640px;">
        <span onclick="videoPenceresiniKapat()" style="position:absolute; top:10px; right:15px; font-size:24px; cursor:pointer; font-weight:bold;">&times;</span>
        <div id="videoAlani"></div>
    </div>
</div>

<!-- VİDEO OYNATMA MOTORU -->
<script>
function videoPencerisiniAc(videoUrl) {
    const modal = document.getElementById('videoModal');
    const videoAlani = document.getElementById('videoAlani');
    
    // Luma'dan aldığınız ücretsiz video linkini sitenizin içine gömer
    videoAlani.innerHTML = `<iframe src="${videoUrl}" width="100%" height="400" frameborder="0" allowfullscreen></iframe>`;
    modal.style.display = 'flex';
}

function videoPenceresiniKapat() {
    const modal = document.getElementById('videoModal');
    const videoAlani = document.getElementById('videoAlani');
    videoAlani.innerHTML = ''; // Video sesinin arkada çalmaya devam etmesini önler
    modal.style.display = 'none';
}
</script>
